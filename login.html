<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - SafeSphere</title>

<style>

body{
    .SafeSphereLogo{
        text-decoration: none;
        color:inherit;
        top:20px;
        position:absolute;
        left:20px;
        padding:0;
        font-size: 25px;
                
        }
    .aboutuslink{
        position:absolute;
        text-decoration: none;
        color:inherit;
        top:20px;
        left:200px;
        padding:0 10px;
        font-size: 25px;
        }
    .aboutuslink:hover, .SafeSphereLogo:hover{
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.3);
        border-radius: 25px;
        background-color:aliceblue;
        color: black;
        }
            
    font-family: "Times New Roman", serif;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:aliceblue;

    background: linear-gradient(
        -45deg,
        #2e2b2b,
        #3a3434,
        #1f1c1c,
        #4c4a4a
    );
    background-size:400% 400%;
    animation:gradientBG 15s ease infinite;
}

/* LOGIN BOX */

.loginbox{
    border:2px solid white;
    padding:40px;
    border-radius:20px;
    width:300px;
    text-align:center;
}

/* TITLE */

h1{
    margin-bottom:30px;
}

/* INPUTS */

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
    border:none;
}

/* BUTTON */

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    border-radius:10px;
    border:none;
    font-size:16px;
    cursor:pointer;
    transition:all 0.3s ease;
}

button:hover{
    background:#d3d3d3;
    transform:scale(1.05);
}

/* BACK LINK */

.backlink{
    display:block;
    margin-top:20px;
    color:aliceblue;
    text-decoration:none;
}

/* BACKGROUND ANIMATION */

@keyframes gradientBG {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
}

</style>
</head>

<body>
  <div class="contentredirectory"> 
            <a href="index.html" class="SafeSphereLogo">SafeSphere</a>
            <a href="about.html" class="aboutuslink">About Us</a>
        </div>   

<div class="loginbox">

<h1>Login</h1>

<form>
<input type="text" placeholder="Username" required>
<input type="password" placeholder="Password" required>

<button type="submit">Login</button>
</form>

<a href="index.html" class="backlink">Back to Home</a>

</div>
</body>
</html>
